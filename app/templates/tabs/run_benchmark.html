{% extends "layout.html" %}

{% block navbar_brand_link %}
{{ url_for("index") }}
{% endblock %}

{% block title %} Run Benchmark {% endblock %}

{% block main %}

<!-- Full page loading spinner which disables clicks -->
<div id="loading_spinner"
  class="d-none bg-white bg-opacity-50 position-fixed overflow-auto start-0 top-0 h-100 w-100 z-2">
  <div class="spinner-border position-absolute top-50 start-50 z-3" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- Import data form -->
<div class="card bg-light import-data-container mx-auto">
  <div class="card-header">
    <h1 class="h2 card-title text-primary mb-0">Run Benchmark<i class="mx-2 fa-solid fa-database"></i></h1>
  </div>
  <div class="card-body py-4">
    <form action="{{ url_for("run_benchmark.index") }}" method="post" accept-charset="utf-8">
      <div class="row mb-3">
        <label for="select_query" class="col-sm-3 col-form-label">Select Query</label>
        <div class="col-sm-9">
          <select id="select_query" name="select_query" class="form-select" aria-label="Select Query">
            <option>Select Query</option>
            {% for query in saved_queries %}
            <option value="{{ query["saved_query_id"] }}">{{ query["saved_query_id"] }} - {{ query["psql_query"][:60] }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <hr class="border border-secondary border-2 ">

      <div class="row mb-3">
        <label for="select_database" class="col-sm-3 col-form-label">Select Database</label>
        <div class="col-sm-9">
          <select id="select_database" name="select_database" class="form-select" aria-label="Select database">
            <option {{ session.get("is_default_selected", "selected") }}>Select Database</option>
            <option {{ session.get("is_warehouse_selected", "") }} value="warehouse">Warehouse</option>
            <option {{ session.get("is_university_selected", "") }} value="university">University</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <label for="psql_query" class="col-sm-3 col-form-label">PostgreSQL Query</label>
        <div class="col-sm-9">
          <textarea class="form-control" id="psql_query"
            name="psql_query">{{ session.get("psql_query", "") }}</textarea>
        </div>
      </div>

      <div class="row mb-3">
        <label for="neo4j_query" class="col-sm-3 col-form-label">Neo4j Query</label>
        <div class="col-sm-9">
          <textarea class="form-control" id="neo4j_query"
            name="neo4j_query">{{ session.get("neo4j_query", "") }}</textarea>
        </div>
      </div>

      <div class="row mb-3">
        <label for="iteration_count" class="col-sm-3 col-form-label">Iteration Count (3-12)</label>

        <div class="col-sm-8 bg-dark-subtle mx-2 rounded">
          <input type="range" min="3" max="12" value="{{ session.get("iteration_count", 3) }}" class="form-range "
            id="iteration_count" name="iteration_count">
        </div>
      </div>

      <div class="d-flex d-md-block mt-4 text-center">
      </div>

      <div class="d-flex mt-4 justify-content-center">
        <!-- Invisible button needed for centering -->
        <button class="btn btn-primary invisible">Save</button>
        <button id="run_button" name="run_button" type="submit"
          class="btn btn-primary me-auto ms-auto col-2">Run</button>
        <button id="save_button" name="save_button" type="submit" class="btn btn-primary ">Save
          <i class="fa-regular fa-floppy-disk"></i></button>
      </div>
    </form>
  </div>
</div>

<script>
  let loadingSpinner = document.getElementById("loading_spinner");
  let runButton = document.getElementById("run_button");
  let querySelector = document.getElementById("select_query");
  let databaseSelector = document.getElementById("select_database");
  let psqlQuery = document.getElementById("psql_query");
  let neo4jQuery = document.getElementById("neo4j_query");
  let iterationCount = document.getElementById("iteration_count");

  function showLoadingSpinner() {
    loadingSpinner.classList.remove("d-none");
  }

  async function fillFormFromSelection() {
    try {
      // let response = await fetch(
      //   "{{ url_for(request.endpoint, **request.view_args) }}" + "/get-query/6"
      // );
      let response = await fetch(
        '{{ url_for("run_benchmark.index") }}' + "/get-query/" + querySelector.value
      );
      let query = await response.json();
      console.log(query);
      databaseSelector.value = query["selected_database"];
      psqlQuery.textContent = query["psql_query"];
      neo4jQuery.textContent = query["neo4j_query"];
      iterationCount.value = query["iteration_count"];
    } catch (err) {
      console.error("Could not fetch the query info: ", err);
    }
  }

  runButton.addEventListener("click", showLoadingSpinner);
  querySelector.addEventListener("change", fillFormFromSelection);
</script>


{% endblock %}
