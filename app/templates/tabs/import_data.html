{% extends "layout.html" %}

{% block navbar_brand_link %}
{{ url_for("index") }}
{% endblock %}

{% block title %} Import Data {% endblock %}

{% block main %}

<!-- Full page loading spinner which disables clicks -->
<div id="loading_spinner"
  class="d-none bg-white bg-opacity-50 position-fixed overflow-auto start-0 top-0 h-100 w-100 z-2">
  <div class="spinner-border position-absolute top-50 start-50 z-3" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- Import data form -->
<div class="card bg-light import-data-container mx-auto">
  <div class="card-header">
    <h1 class="h2 card-title text-primary mb-0">Import Data<i class="mx-2 fa-solid fa-file-import"></i></h1>
  </div>
  <div class="card-body py-4">
    <form action="{{ url_for("import_data.index") }}" method="post" accept-charset="utf-8">

      <div class="d-flex justify-content-center mb-3">
        <select name="select_database" class="form-select w-25" aria-label="Select database">
          <option selected>Select Database</option>
          <option value="warehouse">Warehouse</option>
          <option value="university">University</option>
        </select>
      </div>

      <div class="d-flex justify-content-center">

        <div class="form-check-inline fs-5 col-3 text-end me-1">
          <label class="form-check-label" for="is_import_psql">
            PostgreSQL
          </label>
          <input class="form-check-input" type="checkbox" id="is_import_psql" name="is_import_psql">
        </div>

        <div class="form-check-inline fs-5 col-3 text-start ms-1 me-0">
          <input class="form-check-input" type="checkbox" id="is_import_neo4j" name="is_import_neo4j">
          <label class="form-check-label" for="is_import_neo4j">
            Neo4j
          </label>
        </div>
      </div>

      <div class="d-flex d-md-block mt-4 text-center">
        <button id="import_button" name="import_button" type="submit"
          class="btn btn btn-primary flex-grow-1 col-md-2 me-1">Import</button>
        <button id="drop_button" name="drop_button" type="submit"
          class="btn btn btn-danger flex-grow-1 col-md-2 ms-1">Drop</button>
      </div>

    </form>
  </div>
</div>

<script>
  let loadingSpinner = document.getElementById("loading_spinner");
  let importButton = document.getElementById("import_button");
  let dropButton = document.getElementById("drop_button");

  function showLoadingSpinner() {
    loadingSpinner.classList.remove("d-none");
  }

  importButton.addEventListener("click", showLoadingSpinner);
  dropButton.addEventListener("click", showLoadingSpinner);
</script>


{% endblock %}
