{% extends "layout.html" %}

{% block navbar_brand_link %}
{{ url_for("index") }}
{% endblock %}

{% block title %} Import Data {% endblock %}

{% block main %}

<!-- Create room form -->
<div class="card bg-light import-data-container mx-auto">
  <div class="card-header">
    <h1 class="h2 card-title text-primary mb-0">Import Data<i class="mx-2 fa-solid fa-file-import"></i></h1>
  </div>
  <div class="card-body py-4">
    <form action="{{ url_for("import_data.index") }}" method="post" accept-charset="utf-8">

      <div class="d-flex px-5">
        <div class="form-check-inline fs-4 me-auto">
          <input class="form-check-input" type="checkbox" id="is_import_psql" name="is_import_psql">
          <label class="form-check-label" for="is_import_psql">
            Import to PostgreSQL
          </label>
        </div>

        <div class="form-check-inline fs-4">
          <input class="form-check-input" type="checkbox" id="is_import_neo4j" name="is_import_neo4j">
          <label class="form-check-label" for="is_import_neo4j">
            Import to Neo4j
          </label>
        </div>
      </div>

      <div class="d-flex d-md-block mt-4 text-center">
        <button type="submit" class="btn btn-primary flex-grow-1">Import</button>
      </div>

    </form>
  </div>
</div>


{% endblock %}
