name: ${PROJECT_NAME}
services:
  postgresql:
    image: postgres:15.2
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - PGUSER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # volumes:
    #   - ./.sql:/docker-entrypoint-initdb.d
    # healthcheck taken from : https://stackoverflow.com/a/72175755
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER}" ,"-d", "postgres"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 3s
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ./.sql/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    healthcheck:
      test: wget -O - http://localhost:80/misc/ping || exit 1
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 3s
  neo4j:
    image: neo4j:5.6.0
    ports:
      - "7474:7474" # access neo4j through your browser at http://localhost:7474
      - "7687:7687"
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_db_import_csv_buffer__size=4194304
      - NEO4J_db_memory_transaction_total_max=4GiB
      - NEO4J_server_memory_heap_initial__size=4GiB
      - NEO4J_server_memory_heap_max__size=6GiB
    # healthcheck taken from : https://stackoverflow.com/a/74689805
    volumes:
      - ./.neo4j:/var/lib/neo4j/import:rw
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 3s
  dummy:
    image: hello-world:linux
    depends_on:
      postgresql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
