name: ${PROJECT_NAME}
services:
  app:
    build: .
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    depends_on:
      postgresql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000')" || exit 1
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 3s
  postgresql:
    image: postgres:15.2
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - PGUSER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # healthcheck taken from : https://stackoverflow.com/a/72175755
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 3s
  pgadmin:
    image: dpage/pgadmin4:7.2
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ./.sql/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    healthcheck:
      test: wget -O - http://localhost:80/misc/ping || exit 1
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 3s
  neo4j:
    image: neo4j:5.6.0
    ports:
      - "7474:7474" # access neo4j through your browser at http://localhost:7474
      - "7687:7687"
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_db_import_csv_buffer__size=4194304
      - NEO4J_db_memory_transaction_total_max=6GiB
      - NEO4J_server_memory_heap_initial__size=4GiB
      - NEO4J_server_memory_heap_max__size=6GiB
      # LOAD CSV reads the generated CSV files straight from ./data
      - NEO4J_server_directories_import=/csv
    volumes:
      - ./data:/csv:ro
    # healthcheck taken from : https://stackoverflow.com/a/74689805
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 3s
